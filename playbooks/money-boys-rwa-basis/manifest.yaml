long_description: |
  This Playbook is an autonomous basis trading strategy engineered for tokenized Real World Asset US equity contracts. The core thesis rests on structural price dislocations between synthetic equity fair value and perpetual contract pricing during market trading sessions. The Playbook aims to capture mean-reverting basis expansions when the contract price dislocates from its underlying reference equilibrium. Rather than chasing unverified directional momentum, the strategy approaches the market through deterministic spread evaluation, insisting that every proposed trade clears strict execution hurdle costs before committing capital.

  Entry decisions are governed by basis spread expansion relative to an adaptive moving benchmark. When the observed contract basis deviates upward and surpasses the required entry hurdle after factoring in taker fees and execution slippage, the desk registers actionable conviction and opens a long position. If the basis contracts sharply below fair equilibrium, the strategy instead enters a short position to harvest negative basis convergence. When the spread fails to clear the transaction cost hurdle, the strategy deliberately refuses to enter and remains idle to preserve capital.

  Exits occur when the basis spread converges back toward its historical moving baseline or reverses past neutral territory. As the mispricing compresses within the tighter exit hurdle boundary, the strategy closes the open position to realize accrued spread profits. The Playbook also closes active exposure if the spread experiences structural trend expansion contrary to the mean-reversion assumption, ensuring disciplined risk control without relying on arbitrary trailing indicators.

  Subscribers may configure several operational parameters to align the strategy with their risk profile. Leverage scales position purchasing power and proportional return amplification, allowing subscribers to adjust exposure intensity according to their individual comfort. Margin budget establishes the absolute capital allocation ceiling utilized by the execution engine for order sizing and performance benchmarking. Additional tunable parameters govern the sensitivity of the entry and exit hurdle thresholds and the depth of the rolling equilibrium window.

  The strategy underperforms during extended macro trending regimes where basis dislocation persists or widens without reverting toward fair equilibrium. Volatility shocks around equity earnings announcements, unexpected regulatory halts, and prolonged liquidity droughts can trigger adverse slippage and elevated drawdowns. Backtest evidence does not assure live profitability, and real market executions encounter funding rates, exchange commissions, and fill latency that may induce loss under unsuitable market conditions.

